[workspace]
members = [
  "crates/chiyoda-core",
  "crates/chiyoda-cli",
  "crates/chiyoda-replay",
]
resolver = "3"

[workspace.package]
version = "0.42.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/gongahkia/chiyoda"
authors = ["Chiyoda contributors"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
clap = { version = "4.5.54", features = ["derive"] }
anyhow = "1.0.100"
minifb = "0.28.0"
arrow-array = "59.3.0"
parquet = "59.3.0"
flate2 = "1.1.10"
gif = "0.13.3"
png = "0.18.1"
tar = "0.4.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
xml-rs = "0.8.29"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
